<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OrthoVisionΔ Web v0.9.2 — Architecture Purifiée</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="view" width="640" height="480"></canvas>

      <div id="hud">
        <div class="title">OrthoVisionΔ Web v0.9.2 — Régime Dynamique</div>
        <div id="hud-lines"></div>
      </div>
    </section>

    <section id="controls">
      <button id="startBtn">Démarrer caméra</button>
      
      <!-- Sélecteur synchronisé avec OV.MODES -->
      <select id="modeSelector">
        <option value="IMAGE">Image</option>
        <option value="IMAGE+TRACE">Image+Trace</option>
        <option value="TRACE SEULE">Trace Seule</option>
        <option value="ZONES DELTA">Zones Delta</option>
        <option value="MEMBRANE FINE">Membrane Fine</option>
        <option value="SPECTRE DELTA">Spectre Delta</option>
        <option value="MULTI ECHELLE">Multi Échelle</option>
        <option value="CARTE CALME">Carte Calme</option>
        <option value="FOYER DELTA">Foyer Delta</option>
        <option value="FOYER VIVANT">Foyer Vivant</option>
        <option value="PRESENCE DELTA">Présence Delta</option>
        <option value="MEMOIRE VIVE">Mémoire Vive</option>
        <option value="PULSATION LUMINEUSE">Pulsation Lumineuse</option>
        <option value="CONTRASTE ORGANIQUE">Contraste Organique</option>
        <option value="RELIEF OPTIQUE">Relief Optique</option>
        <option value="RELIEF PUR">Relief Pur</option>
        <option value="RELIEF NOIR">Relief Noir</option>
        <option value="PARALLAXE VIVANTE">Parallaxe Vivante</option>
        <option value="AUDIOPULSE">AudioPulse</option>
      </select>

      <button id="qualityBtn">QualitéΔ : Normal</button>
      <button id="pauseBtn">Pause</button>
      <button id="hudBtn">HUD ON/OFF</button>
      <button id="fullscreenBtn">Plein écran</button>
      <button id="captureBtn">Capture</button>
      <button id="resetBtn">Reset mémoire</button>
      <button id="cameraBtn">Caméra avant/arrière</button>
      <button id="audioBtn">AudioPulseΔ OFF</button>
    </section>

    <section id="notes">
      <p>v0.9.2 : Architecture de Dispatch purifiée. Moteur à flux de données sans branchements binaires.</p>
    </section>
  </main>

  <script src="js/orthovision-state.js"></script>
  <script src="js/orthovision-core.js"></script>
  <script src="js/orthovision-views.js"></script>
  <script src="js/orthovision-audio.js"></script>
  <script src="js/orthovision-ui.js"></script>
</body>
</html>
